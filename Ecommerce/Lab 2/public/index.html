<!DOCTYPE html>
<html>
<head>
  <title>Lab 2: Sign Up</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
    form { border: 1px solid #ccc; border-radius: 8px; padding: 20px; width: 280px; }
    input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    a { display: block; margin-top: 10px; font-size: 13px; color: #2563eb; text-align: center; }
  </style>
</head>
<body>
  <h2>E-Commerce: 1. Sign Up</h2>

  <form id="signupForm">
    Name: <input type="text" id="name" required>
    Email: <input type="email" id="email" required>
    Password: <input type="password" id="password" required>
    <button type="submit">Sign Up</button>
    <a href="login.html">Already registered? Log in here</a>
  </form>

  <script>
    document.getElementById('signupForm').onsubmit = (e) => {
      e.preventDefault();
      fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || 'Signed up!');
        window.location.href = 'login.html';
      });
    };
  </script>
</body>
</html>

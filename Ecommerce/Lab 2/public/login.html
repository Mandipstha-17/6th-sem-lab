<!DOCTYPE html>
<html>
<head>
  <title>Lab 2: Log In</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
    form { border: 1px solid #ccc; border-radius: 8px; padding: 20px; width: 280px; }
    input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    a { display: block; margin-top: 10px; font-size: 13px; color: #2563eb; text-align: center; }
  </style>
</head>
<body>
  <h2>E-Commerce: 2. Log In</h2>

  <form id="loginForm">
    Email: <input type="email" id="email" required>
    Password: <input type="password" id="password" required>
    <button type="submit">Log In</button>
    <a href="index.html">Don't have an account? Sign up</a>
  </form>

  <script>
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.user) {
          window.location.href = `products.html?userId=${data.user.id}&name=${data.user.name}`;
        } else {
          alert(data.error);
        }
      });
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Lab 2: Select Products</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .products { display: flex; gap: 20px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; width: 250px; }
    img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
    p { font-size: 14px; color: #555; }
    button { background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>E-Commerce Store: Select Products</h2>
  <h3 id="welcomeMsg" style="color: #2563eb;"></h3>

  <div class="products">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=300" alt="PlayStation 5">
      <h3>PlayStation 5</h3>
      <p>Ultra-high speed SSD, ray tracing, immersive 4K gaming, and DualSense haptic feedback.</p>
      <b>Price: Rs. 75,000</b><br><br>
      <button onclick="order('PlayStation 5 Console', 75000)">Add to Cart & Order</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=300" alt="Canon Camera">
      <h3>Canon EOS Camera</h3>
      <p>24.2 MP APS-C CMOS sensor, 4K UHD video recording, and high-speed autofocus.</p>
      <b>Price: Rs. 92,000</b><br><br>
      <button onclick="order('Canon Mirrorless Camera', 92000)">Add to Cart & Order</button>
    </div>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const userId = q.get('userId');
    const name = q.get('name');
    document.getElementById('welcomeMsg').innerText = `Welcome, ${name || 'User'}!`;

    function order(product, price) {
      fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, product, price })
      })
      .then(res => res.json())
      .then(() => {
        window.location.href = 'success.html' + location.search;
      });
    }
  </script>
</body>
</html>

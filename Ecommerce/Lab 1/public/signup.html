<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
    form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 280px; }
    input, textarea { width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Sign Up to Place Order</h2>
  <h4 id="info" style="color: #2563eb; margin-top: 0;"></h4>

  <form id="form">
    Name: <input id="name" required>
    Email: <input type="email" id="email" required>
    Password: <input type="password" id="password" required>
    Phone: <input type="tel" id="phone" required>
    Address: <textarea id="address" rows="2" required></textarea>
    <button type="submit">Place Order</button>
  </form>

  <script>
    const q = new URLSearchParams(location.search);
    const product = q.get('product');
    const price = q.get('price');
    document.getElementById('info').innerText = `${product} (Rs. ${price})`;

    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault();
      fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          phone: document.getElementById('phone').value,
          address: document.getElementById('address').value,
          product,
          price
        })
      })
      .then(() => window.location.href = 'success.html');
    };
  </script>
</body>
</html>
